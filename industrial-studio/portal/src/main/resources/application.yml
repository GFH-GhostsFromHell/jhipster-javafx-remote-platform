server:
  address: ${STUDIO_BIND:127.0.0.1}
  port: ${PORT:8090}
spring:
  datasource:
    url: ${STUDIO_DB_URL:jdbc:h2:file:./data/industrial-studio;DB_CLOSE_ON_EXIT=FALSE}
    username: ${STUDIO_DB_USER:sa}
    password: ${STUDIO_DB_PASSWORD:}
studio:
  admin-user: ${STUDIO_ADMIN_USER:studio-admin}
  admin-password: ${STUDIO_ADMIN_PASSWORD:}
  viewer-user: ${STUDIO_VIEWER_USER:studio-viewer}
  viewer-password: ${STUDIO_VIEWER_PASSWORD:}

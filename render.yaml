services:
  - type: web
    name: remote-javafx-portal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.portal
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: remote-javafx-portal-db
          property: connectionString
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"

databases:
  - name: remote-javafx-portal-db
    plan: free
    region: ohio

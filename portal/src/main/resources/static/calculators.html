function n(id){const v=parseFloat(document.getElementById(id).value);if(!Number.isFinite(v))throw new Error('Check '+id);return v}function i(id){return Math.trunc(n(id))}function b(id){return document.getElementById(id).checked}function s(id){return document.getElementById(id).value}function csvN(id){return s(id).split(',').map(x=>parseFloat(x.trim())).filter(Number.isFinite)}function csvI(id){return s(id).split(',').map(x=>parseInt(x.trim(),10)).filter(Number.isFinite)}
async function api(url,opt={}){const r=await fetch(url,opt);if(r.status===401){location.href='/';throw new Error('Not signed in')}if(!r.ok){let t=await r.text();throw new Error(t||('HTTP '+r.status))}return r.json()}async function post(url,body,out){const e=document.getElementById(out);e.textContent='Calculating…';try{e.textContent=format(await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}))}catch(err){e.textContent='Calculation failed: '+err.message}}function format(x,indent=''){if(x===null||x===undefined)return String(x);if(Array.isArray(x))return x.map((v,k)=>indent+(k+1)+'. '+(typeof v==='object'?'\n'+format(v,indent+'   '):v)).join('\n');if(typeof x==='object')return Object.entries(x).map(([k,v])=>indent+k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase())+': '+(typeof v==='object'?'\n'+format(v,indent+'  '):v)).join('\n');return String(x)}function calcLocal(out,fn){const e=document.getElementById(out);try{e.textContent=fn()}catch(err){e.textContent='Check inputs: '+err.message}}

function field(label,id,val,type='number'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${val}"></div>`}function select(label,id,opts,val){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option ${String(x)===String(val)?'selected':''}>${x}</option>`).join('')}</select></div>`}function work(inputs,button,resultId){return `<div class="workspace"><div>${inputs}${button}</div><pre class="result" id="${resultId}">Enter the question facts, then calculate.</pre></div>`}function btn(text,onclick){return `<button class="btn" onclick="${onclick}">${text}</button>`}function card(title,body){return `<div class="card"><h3>${title}</h3>${body}</div>`}function refs(items){return `<div class="refgrid">${items.map(([a,b])=>`<div class="ref"><b>${a}</b><span class="note">${b}</span></div>`).join('')}</div>`}

s8Panes.push(work(card('Other occupancy — Rule 8-210 / Table 14',`<div class="grid">${field('Occupancy','o_name','Hotel / commercial','text')}${field('Area m²','o_area',775)}${field('Table 14 W/m²','o_wpm',20)}${field('Table demand factor','o_df',.8)}${field('Special load kW','o_special',40)}${field('Heat kW','o_heat',75)}${field('A/C kW','o_ac',50)}${field('Motor / other special kW','o_motor',0)}${field('EVSE kW','o_ev',0)}${field('Voltage','o_v',208)}${select('Phases','o_ph',[1,3],3)}<div class="field"><label><input id="o_int" type="checkbox" checked> Heat/A-C interlocked</label></div></div>`),btn('Calculate other occupancy','post(`/api/calculators/service/other`,{occupancy:s(`o_name`),area:n(`o_area`),wattsPerM2:n(`o_wpm`),tableDemand:n(`o_df`),specialKw:n(`o_special`),heatKw:n(`o_heat`),acKw:n(`o_ac`),interlocked:b(`o_int`),motorKw:n(`o_motor`),evseKw:n(`o_ev`),voltage:n(`o_v`),phases:i(`o_ph`)},`o_o`)'),'o_o'));

const html={s2:`<section id="s2" class="section"><h1>Section 2 — General Rules</h1><p class="lead">Fast exam/field reminders. Original summaries, not reproduced Code text.</p>${refs([['Approvals / markings','Check approval, markings, ratings and intended use before applying a calculator.'],['Working space / access','Provide required access and working space for the specific equipment/location.'],['Environmental suitability','Dry, damp, wet, corrosive and hazardous conditions affect wiring method and enclosure selection.'],['Code hierarchy','General sections apply broadly; supplementary sections can amend or add requirements.'],['Units / definitions','Confirm line/phase voltage, AC/DC category, ampacity and whether the question gives FLC, FLA or RLA.'],['Verification','Check calculator results against CEC 2024 and equipment markings before field use.']])}</section>`,s4:`<section id="s4" class="section"><h1>Section 4 — Conductors / Busbars</h1><p class="lead">Bare-busbar worksheet sizing, reverse sizing, parallel bars and current-density calculations.</p>${tabSet('s4',['Dimensions → Ampacity','Current → Bar Size','Parallel Straps / Bars','Current Density'])}</section>`,s8:`<section id="s8" class="section"><h1>Section 8 — Circuit Loading & Demand</h1><p class="lead">Occupancy-specific service worksheets.</p>${tabSet('s8',['Residential','Apartment','School','Hospital','Other'])}</section>`,s12:`<section id="s12" class="section"><h1>Section 12 — Wiring Methods</h1><p class="lead">Fill, bending and raceway support tools.</p>${tabSet('s12',['Conduit Fill','Box Fill','Conduit Bending','Cable Straps','Conduit Supports'])}</section>`,s14:`<section id="s14" class="section"><h1>Section 14 — Protection & Control</h1><p class="lead">Tap/splitter checks.</p>${tabSet('s14',['Tap / Splitter'])}</section>`,s16:`<section id="s16" class="section"><h1>Section 16 — Class 1 & Class 2 Circuits</h1><p class="lead">Low-voltage source current, fuse/OCPD and conductor ampacity checks.</p>${tabSet('s16',['Low-Voltage Circuit'])}</section>`,s24:`<section id="s24" class="section"><h1>Section 24 — Patient Care Areas</h1><p class="lead">Environment planning, quick reference and low-voltage checks.</p>${tabSet('s24',['Environment','Care / Isolated Systems'])}</section>`,s26:`<section id="s26" class="section"><h1>Section 26 — Installation of Electrical Equipment</h1><p class="lead">Transformers and capacitor banks.</p>${tabSet('s26',['Dry Transformer','Medium Voltage','High Voltage','Capacitor Bank','PF Correction'])}</section>`,s28:`<section id="s28" class="section"><h1>Section 28 — Motors & Generators</h1><p class="lead">AC motors, DC motors, multiple motors and refrigeration.</p>${tabSet('s28',['AC Motor','DC Motor','Multiple Motors','Refrigeration'])}</section>`,s32:`<section id="s32" class="section"><h1>Section 32 — Fire Alarm / Fire Pumps</h1><p class="lead">Fire-alarm reference, low-voltage checks, EOL current and fire-pump ampacity.</p>${tabSet('s32',['Fire Alarm / LV','EOL Current','Fire Pump'])}</section>`,s42:`<section id="s42" class="section"><h1>Section 42 — Electric Welders</h1><p class="lead">Single and multiple-welder worksheets.</p>${tabSet('s42',['Single Welder','Multiple Welder Feeder'])}</section>`};
nav.innerHTML=sections.map(([id,num,name],j)=>`<button class="${j?'':'active'}" onclick="showSection('${id}',this)">${num} — ${name}</button>`).join('');main.innerHTML=sections.map(x=>html[x[0]]).join('');document.getElementById('s2').classList.add('active');function showSection(id,button){document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));button.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function busK(mat){return mat==='Aluminum'?700:1000}
function calcBusDim(){calcLocal('o_bb_dim',()=>{const mat=s('bb_mat'),w=n('bb_w'),t=n('bb_t'),area=w*t,k=busK(mat),raw=area/645*k,applies=t<=6.35,used=applies?Math.min(raw,1200):raw;return `BUSBAR — DIMENSIONS TO AMPACITY\n\nMaterial: ${mat}\nArea = ${w.toFixed(2)} × ${t.toFixed(2)} = ${area.toFixed(2)} mm²\nArea = ${(area/645).toFixed(4)} in²\n\nI = (Area ÷ 645) × ${k}\nCalculated current = ${raw.toFixed(2)} A\n${applies?`Rule 4-036 practice cap = 1200 A\nWorksheet value used = ${used.toFixed(2)} A`:'Thickness exceeds 6.35 mm — verify the actual CEC busbar requirements rather than using the flat-bar shortcut.'}\n\nPractice method: copper 1000 A/in²; aluminum 700 A/in².`})}
function calcBusSize(){calcLocal('o_bb_size',()=>{const mat=s('bs_mat'),amps=n('bs_i'),t=n('bs_t'),w=n('bs_w'),k=busK(mat),area=amps*645/k,rw=area/t,rt=area/w;return `BUSBAR — CURRENT TO SIZE\n\nMaterial: ${mat}\nTarget current: ${amps.toFixed(2)} A\n\nA = I × 645 ÷ K = ${area.toFixed(2)} mm²\n\nWith ${t.toFixed(2)} mm thickness:\nRequired width = ${rw.toFixed(2)} mm\n\nWith ${w.toFixed(2)} mm width:\nRequired thickness = ${rt.toFixed(2)} mm\n\n${amps>1200?'Target exceeds the 1200 A single-bar practice limit — use parallel bars/straps or an engineered arrangement.':'Practice Rule 4-036 worksheet method.'}`})}
function calcBusStraps(){calcLocal('o_bb_straps',()=>{const mat=s('bp_mat'),amps=n('bp_i'),w=n('bp_w'),t=n('bp_t');if(t>6.35)throw new Error('This worksheet strap method is limited to bar thickness at or below 6.35 mm');const k=busK(mat),area=w*t,raw=area/645*k,per=Math.min(raw,1200),count=Math.ceil(amps/per),share=amps/count;return `PARALLEL BUSBAR / STRAP COUNT\n\nOne bar area = ${area.toFixed(2)} mm²\nRaw one-bar ampacity = ${raw.toFixed(2)} A\nOne-bar worksheet value after 1200 A cap = ${per.toFixed(2)} A\n\nN = total current ÷ one-bar current, rounded UP\nN = ${(amps/per).toFixed(3)} → ${count} bars / straps\n\nEqual-share load = ${share.toFixed(2)} A per bar\nCombined worksheet capacity = ${(count*per).toFixed(2)} A\nTotal metal area = ${(count*area).toFixed(2)} mm²\n\nVerify spacing, terminations, current sharing, temperature rise and equipment construction for real installations.`})}
function calcBusDensity(){calcLocal('o_bb_density',()=>{const amps=n('bd_i'),j=n('bd_j'),t=n('bd_t'),area=amps/j,w=area/t;return `EDITABLE CURRENT-DENSITY METHOD\n\nJ = I ÷ A\nA = I ÷ J\n\nA = ${amps.toFixed(2)} ÷ ${j.toFixed(3)} = ${area.toFixed(2)} mm²\nWith ${t.toFixed(2)} mm thickness:\nRequired width = ${w.toFixed(2)} mm\n\nExample: 1200 A ÷ 1.2 A/mm² = 1000 mm².\n\nThis is a generic study/engineering calculation, not a replacement for Rule 4-036 or thermal/equipment design.`})}
function calcBends(){calcLocal('o_bend',()=>{const deg=n('bend_angle'),rad=deg*Math.PI/180,r=n('bend_rise'),m=1/Math.sin(rad),space=r*m,shrink=r*Math.tan(rad/2),vo=n('bend_v'),ho=n('bend_h'),trueOff=Math.hypot(vo,ho),rollSpace=trueOff*m,rollShrink=trueOff*Math.tan(rad/2),stub=n('bend_stub')-n('bend_take');return `OFFSET BEND\nMultiplier: ${m.toFixed(3)}\nBend-mark spacing: ${space.toFixed(1)} mm\nShrink: ${shrink.toFixed(1)} mm\n\nROLLING OFFSET\nTrue offset: ${trueOff.toFixed(1)} mm\nBend-mark spacing: ${rollSpace.toFixed(1)} mm\nShrink: ${rollShrink.toFixed(1)} mm\n\n90° STUB\nMark from end: ${stub.toFixed(1)} mm\n\nUse actual bender take-up and verify minimum bend radius.`})}
function cableStrapRule(t,connector){if(t.startsWith('NMD90'))return[1.5,.3,'CEC 2024 Rule 12-560(1)'];let near=connector==='36-78 mm'?.6:connector==='>78 mm'?.9:.3;return[1.5,near,'CEC 2024 Rule 12-618(1)']}
function minimumCableStraps(L,space,near){if(!(L>0)||!(space>0)||near<0)throw new Error('Run length and spacing must be positive');return L<=2*near?1:1+Math.ceil((L-2*near)/space)}
function calcCableStraps(){calcLocal('o_cs',()=>{const t=s('cs_type'),connector=s('cs_conn'),L=n('cs_run'),[space,near,ref]=cableStrapRule(t,connector),count=minimumCableStraps(L,space,near);return `${t}\
Maximum spacing between straps/supports: ${space.toFixed(2)} m\
Maximum distance from each termination: ${near.toFixed(2)} m\
Minimum straps/support points for this straight run: ${count}\
Reference: ${ref}\
\
${t.startsWith('NMD90')?'NMD90 holes through joists/studs can count as support; fished-cable exceptions are not included in this straight-run count.':'BX/AC90 termination distance depends on connector trade size, which is why this calculator asks for the connector range.'}`})}
function conduitSupportRule(t,z){if(t==='Rigid metal conduit')return[z<=21?1.5:z<=35?2:3,0,'CEC 2024 Rule 12-1010'];if(t==='EMT')return[z<=21?1.5:z<=35?2:3,1,'CEC 2024 EMT support rule with Rule 12-1010 spacing'];if(t==='Rigid PVC conduit')return[z<=27?.75:z<=41?1.2:z<=53?1.5:z<=78?1.8:z<=129?2.1:2.5,0,'CEC 2024 Rule 12-1114'];if(t==='Flexible metal conduit')return[1.5,.3,'CEC 2024 Rule 12-1010(3)'];if(t==='Liquid-tight flexible conduit')return[1.5,.3,'CEC 2024 Rule 12-1308'];return[1,1,'CEC 2024 ENT support rule']}
function calcConduitSupports(){calcLocal('o_rs',()=>{const t=s('rs_type'),z=i('rs_size'),L=n('rs_run'),[space,near,ref]=conduitSupportRule(t,z),count=near>0?minimumCableStraps(L,space,near):Math.max(1,Math.ceil(L/space));return `${t}\
Trade size: ${z} mm\
Maximum support spacing: ${space.toFixed(2)} m\
Termination fastening/support: ${near?`within ${near.toFixed(2)} m`:'no separate end-distance entered by this worksheet'}\
Estimated minimum support points: ${count}\
Reference: ${ref}\
\
This is a raceway-support calculation, not the NMD90/BX cable-strap formula. Verify actual installation geometry and exceptions.`})}
function calcLV(p){calcLocal('o_'+p,()=>{const cls=s(p+'_class'),va=n(p+'_va'),v=n(p+'_v'),max=n(p+'_max'),fuse=n(p+'_fuse'),cable=n(p+'_cable'),amps=va/v;return `${cls.toUpperCase()} LOW-VOLTAGE CIRCUIT\n\nSource current = ${va.toFixed(1)} VA ÷ ${v.toFixed(1)} V = ${amps.toFixed(2)} A\n\nMaximum permitted OCPD entered: ${max.toFixed(2)} A\nSelected fuse/OCPD: ${fuse.toFixed(2)} A → ${fuse<=max?'PASS':'FAIL'}\n\nCable ampacity: ${cable.toFixed(2)} A → ${cable>=amps?'PASS vs source current':'CHECK'}\nCable: ${s(p+'_desc')}\n\nVerify Rule 16-200/Table 57 and any Section 24/32 or listed-equipment requirements.`})}function calcPatient(){calcLocal('o_pc',()=>{const l=n('pc_len'),w=n('pc_wid');return `PATIENT CARE ENVIRONMENT — PLANNING VIEW\n\nBed/table: ${l.toFixed(2)} m × ${w.toFixed(2)} m\nPlanning footprint: ${(l+3).toFixed(2)} m × ${(w+3).toFixed(2)} m\nVertical extent: 2.3 m above floor\n\nPlanning aid only; verify facility classification and Section 24.`})}function calcEol(){calcLocal('o_eol',()=>{const v=n('eol_v'),r=n('eol_r'),a=v/r;return `END-OF-LINE CURRENT\n\nI = V ÷ R = ${a.toFixed(6)} A = ${(a*1000).toFixed(2)} mA\n\nUse the listed fire-alarm equipment's actual EOL requirement.`})}function calcFirePump(){calcLocal('o_fp',()=>{const req=1.25*(n('fp_f')+n('fp_j')+n('fp_a'));return `FIRE-PUMP SUPPLY CONDUCTOR\n\nRequired ampacity = 125% × total = ${req.toFixed(1)} A\n\nConductor ampacity only; controller, OCPD/disconnect and wiring method have dedicated rules.`})}
const standards=[15,20,25,30,35,40,45,50,60,70,80,90,100,110,125,150,175,200,225,250,300,350,400,450,500,600,700,800,1000,1200];function notAbove(x){return standards.filter(v=>v<=x).pop()||x}function starterConductor(a){const t=[[20,'#14'],[25,'#12'],[35,'#10'],[50,'#8'],[65,'#6'],[85,'#4'],[100,'#3'],[115,'#2'],[130,'#1'],[150,'1/0'],[175,'2/0'],[200,'3/0'],[230,'4/0']];for(const [amp,size] of t)if(a<=amp)return size+' Cu (starter 75°C lookup)';return 'Above starter lookup range'}function buildWelderRows(){const vals=[[25,.55,20],[63,.45,35],[33,.55,20],[25,.63,20],[42,.45,20]];welderRows.innerHTML=vals.map((r,k)=>`<div class="welder-row"><div class="n">#${k+1}</div><div class="field"><label>Input A</label><input id="wg_i${k}" type="number" value="${r[0]}"></div><div class="field"><label>Duty factor</label><input id="wg_d${k}" type="number" step=".01" value="${r[1]}"></div><div class="field"><label>Branch conductor ampacity A</label><input id="wg_c${k}" type="number" value="${r[2]}"></div></div>`).join('')}function calcWelders(){calcLocal('o_wg',()=>{let rows=[];for(let k=0;k<5;k++){const input=n('wg_i'+k),duty=n('wg_d'+k),cond=n('wg_c'+k);rows.push({k:k+1,input,duty,cond,adj:input*duty,branchCalc:input*2})}const ordered=[...rows].sort((a,b)=>b.adj-a.adj),factors=[1,1,.85,.70,.60],feeder=ordered.reduce((sum,r,k)=>sum+r.adj*factors[k],0),largest=[...rows].sort((a,b)=>b.branchCalc-a.branchCalc)[0],feederOcpdCalc=largest.branchCalc+rows.filter(r=>r!==largest).reduce((x,r)=>x+r.adj,0),feederOcpd=notAbove(feederOcpdCalc);let text='MULTIPLE-WELDER FEEDER\n\n';rows.forEach(r=>text+=`Welder ${r.k}: ${r.input.toFixed(2)} A × ${r.duty.toFixed(2)} = ${r.adj.toFixed(2)} A\n`);text+='\nFEEDER DEMAND\n';ordered.forEach((r,k)=>text+=`${Math.round(factors[k]*100)}% × Welder ${r.k}: ${(r.adj*factors[k]).toFixed(2)} A\n`);text+=`\nFeeder load = ${feeder.toFixed(2)} A\nStarter conductor = ${starterConductor(feeder)}\n\nFeeder OCPD calculation = ${feederOcpdCalc.toFixed(2)} A\nCommon size not exceeding = ${feederOcpd} A\n\nDefault worksheet should give about 81 A and 175 A.`;return text})}async function logout(){await fetch('/logout',{method:'POST'});location.href='/'}buildWelderRows();api('/api/profile').catch(()=>location.href='/');

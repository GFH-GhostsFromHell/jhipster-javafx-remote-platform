server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
spring:
  application:
    name: remotePortal
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/remoteportal;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECTION_TIMEOUT_MS:10000}
      "[mail.smtp.timeout]": ${SMTP_READ_TIMEOUT_MS:10000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:10000}
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me-now}
  client:
    seed:
      username: ${CLIENT_USERNAME:bryn}
      password: ${CLIENT_PASSWORD:bryn}
      display-name: ${CLIENT_DISPLAY_NAME:Bryn Flewelling}

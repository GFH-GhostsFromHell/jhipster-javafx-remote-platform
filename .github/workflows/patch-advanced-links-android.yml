name: Patch Android advanced calculator links
on:
  push:
    branches: [development/functionality]
    paths: ['.github/workflows/patch-advanced-links-android.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: development/functionality}
      - name: Add Android advanced calculator entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-client/app/src/main/java/com/gfh/electricalworkbench/MainActivity.kt')
          x=p.read_text()
          old='''        "Section 28 · AC & DC Motors", "Section 32 · Fire Alarm", "Section 42 · Welders",\n        "Conduit Bending", "Supports & Straps"'''
          new='''        "Section 28 · AC & DC Motors", "Section 32 · Fire Alarm", "Section 42 · Welders",\n        "Advanced · Grounding, Fire Pump, Neutral, Services, HVAC, Fire Alarm & Derating",\n        "Conduit Bending", "Supports & Straps"'''
          if old not in x: raise SystemExit('section list marker missing')
          x=x.replace(old,new,1)
          old2='''        OutlinedButton(onClick = { onOpenWeb("/bend-calcs.html") }, modifier = Modifier.fillMaxWidth()) {\n            Icon(Icons.Default.Launch, null)\n            Spacer(Modifier.width(8.dp))\n            Text("Open visual conduit bender", fontWeight = FontWeight.SemiBold)\n        }'''
          new2='''        OutlinedButton(onClick = { onOpenWeb("/advanced-calculations.html") }, modifier = Modifier.fillMaxWidth()) {\n            Icon(Icons.Default.Calculate, null)\n            Spacer(Modifier.width(8.dp))\n            Text("Open advanced calculation pack", fontWeight = FontWeight.SemiBold)\n        }\n\n'''+old2
          if old2 not in x: raise SystemExit('bender button marker missing')
          x=x.replace(old2,new2,1)
          p.write_text(x)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-client/app/src/main/java/com/gfh/electricalworkbench/MainActivity.kt
          git commit -m 'Add advanced calculation pack to Android'
          git push origin HEAD:development/functionality

name: Patch advanced calculator links
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-advanced-links-main.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Add portal links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portal/src/main/resources/static/portal.html')
          x=p.read_text()
          nav='''      <a href="/calculators.html"><span class="icon">∑</span><span class="label">CEC Calculators</span></a>'''
          nav2=nav+'\n      <a href="/advanced-calculations.html"><span class="icon">⚡</span><span class="label">Advanced Calculations</span></a>'
          if nav not in x: raise SystemExit('portal nav marker missing')
          x=x.replace(nav,nav2,1)
          quick='''<a class="quick" href="/calculators.html"><strong>CEC calculator workspace</strong><span>Open section-based calculators and worksheets.</span></a>'''
          quick2=quick+'''<a class="quick" href="/advanced-calculations.html"><strong>Advanced calculation pack</strong><span>Grounding, fire pumps, neutral, advanced services, motors, transformer fault, HVAC, fire alarm and conductor derating.</span></a>'''
          if quick not in x: raise SystemExit('quick action marker missing')
          x=x.replace(quick,quick2,1)
          p.write_text(x)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add portal/src/main/resources/static/portal.html
          git commit -m 'Link advanced calculation pack from portal'
          git push origin HEAD:main

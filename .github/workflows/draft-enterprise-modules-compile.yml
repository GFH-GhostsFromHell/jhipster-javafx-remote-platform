name: Draft Enterprise Modules Compile

on:
  push:
    branches: [ draft-enterprise-modules ]
    paths:
      - 'desktop-client/**'
      - '.github/workflows/draft-enterprise-modules-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile desktop client
        run: mvn -B -DskipTests compile

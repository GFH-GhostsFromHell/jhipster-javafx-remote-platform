name: Restore desktop live updater

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-desktop-updater.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore startup and live update checks
        shell: python
        run: |
          from pathlib import Path

          native = Path('desktop-client/src/main/java/com/example/desktop/ElectricalWorkbenchNativeApp.java')
          text = native.read_text(encoding='utf-8')

          if 'private javafx.animation.Timeline updatePoller;' not in text:
              text = text.replace(
                  '    private StackPane workspace;\n',
                  '    private StackPane workspace;\n    private javafx.animation.Timeline updatePoller;\n'
              )

          if 'private void showLogin() {\n        stopUpdatePolling();' not in text:
              text = text.replace(
                  '    private void showLogin() {\n',
                  '    private void showLogin() {\n        stopUpdatePolling();\n'
              )

          old_login = '        loginCard.getChildren().addAll(loginTitle,new Label("Use your Electrical Workbench account."),fieldLabel("Username"),username,fieldLabel("Password"),password,login,accountAccess,message);\n\n        GridPane layout='
          new_login = '''        Button updateCheck = new Button("Checking for updates…");
        updateCheck.setMaxWidth(Double.MAX_VALUE);
        updateCheck.setStyle("-fx-background-color:#ecfeff;-fx-text-fill:#155e75;-fx-border-color:#a5f3fc;-fx-border-radius:8;-fx-background-radius:8;-fx-padding:8 10;-fx-font-weight:bold;");
        updateCheck.setOnAction(e -> checkForUpdates(updateCheck,false));
        loginCard.getChildren().addAll(loginTitle,new Label("Use your Electrical Workbench account."),fieldLabel("Username"),username,fieldLabel("Password"),password,login,accountAccess,updateCheck,message);

        GridPane layout='''
          if old_login in text:
              text = text.replace(old_login, new_login)

          old_scene = '        stage.setScene(new Scene(root,1040,680));\n    }\n\n    private void showWorkspace() {'
          new_scene = '''        stage.setScene(new Scene(root,1040,680));
        checkForUpdates(updateCheck,true);
    }

    private void showWorkspace() {'''
          if old_scene in text:
              text = text.replace(old_scene, new_scene)

          old_update_button = '        Button update=new Button("Checking updates…");update.setVisible(false);update.setManaged(false);update.setStyle("-fx-background-color:#16a34a;-fx-text-fill:white;-fx-font-weight:bold;-fx-background-radius:8;-fx-padding:7 10;");'
          new_update_button = '        Button update=new Button("Check updates");update.setVisible(true);update.setManaged(true);update.setStyle("-fx-background-color:#0e7490;-fx-text-fill:white;-fx-font-weight:bold;-fx-background-radius:8;-fx-padding:7 10;");update.setOnAction(e->checkForUpdates(update,false));'
          text = text.replace(old_update_button, new_update_button)
          text = text.replace('root.setTop(top);checkForUpdates(update);', 'root.setTop(top);startUpdatePolling(update);')

          start_marker = '    private void checkForUpdates(Button button)'
          end_marker = '    private static String escapeHtml(String text)'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Updater method markers were not found')

          replacement = '''    private void checkForUpdates(Button button, boolean promptWhenAvailable){
        button.setDisable(true);
        if(!button.getText().startsWith("Update v")) button.setText("Checking updates…");
        CompletableFuture.supplyAsync(()->{try{return updater.check();}catch(Exception ex){throw new RuntimeException(ex);}})
            .whenComplete((info,err)->Platform.runLater(()->{
                button.setDisable(false);
                button.setVisible(true);button.setManaged(true);
                if(err!=null){
                    button.setText("Update check failed — retry");
                    button.setStyle("-fx-background-color:#b45309;-fx-text-fill:white;-fx-font-weight:bold;-fx-background-radius:8;-fx-padding:7 10;");
                    button.setOnAction(e->checkForUpdates(button,false));
                    return;
                }
                if(info==null||!info.updateAvailable()){
                    button.setText("Up to date · v"+updater.currentVersion());
                    button.setStyle("-fx-background-color:rgba(255,255,255,.12);-fx-text-fill:white;-fx-border-color:rgba(255,255,255,.20);-fx-border-radius:8;-fx-background-radius:8;-fx-padding:7 10;");
                    button.setOnAction(e->checkForUpdates(button,false));
                    return;
                }
                button.setText("Update available · v"+info.latestVersion());
                button.setStyle("-fx-background-color:#16a34a;-fx-text-fill:white;-fx-font-weight:bold;-fx-background-radius:8;-fx-padding:7 10;");
                button.setOnAction(e->installUpdate(info,button));
                if(promptWhenAvailable) installUpdate(info,button);
            }));
    }

    private void startUpdatePolling(Button button){
        stopUpdatePolling();
        checkForUpdates(button,false);
        updatePoller=new javafx.animation.Timeline(new javafx.animation.KeyFrame(javafx.util.Duration.seconds(60),e->checkForUpdates(button,false)));
        updatePoller.setCycleCount(javafx.animation.Animation.INDEFINITE);
        updatePoller.play();
    }

    private void stopUpdatePolling(){
        if(updatePoller!=null){updatePoller.stop();updatePoller=null;}
    }

    private void installUpdate(UpdateService.UpdateInfo info,Button button){Alert confirm=new Alert(Alert.AlertType.CONFIRMATION);confirm.initOwner(stage);confirm.setTitle("Update Electrical Workbench");confirm.setHeaderText("Install version "+info.latestVersion()+"?");confirm.setContentText("The MSI will download, verify, install, and relaunch the desktop app.");Optional<ButtonType> answer=confirm.showAndWait();if(answer.isEmpty()||answer.get()!=ButtonType.OK)return;button.setDisable(true);button.setText("Downloading…");CompletableFuture.supplyAsync(()->{try{return updater.downloadAndVerify(info);}catch(Exception ex){throw new RuntimeException(ex);}}).whenComplete((msi,err)->Platform.runLater(()->{if(err!=null){button.setDisable(false);button.setText("Update available · v"+info.latestVersion());new Alert(Alert.AlertType.ERROR,message(unwrap(err))).showAndWait();return;}try{updater.launchInstallerAndRelaunch(msi);Platform.exit();}catch(Exception ex){button.setDisable(false);new Alert(Alert.AlertType.ERROR,ex.getMessage()).showAndWait();}}));}

'''
          text = text[:start] + replacement + text[end:]
          native.write_text(text, encoding='utf-8')

          launcher = Path('desktop-client/src/main/java/com/example/desktop/Launcher.java')
          launch_text = launcher.read_text(encoding='utf-8')
          launch_text = launch_text.replace('        startPreLoginUpdateCheck();\n', '')
          launcher.write_text(launch_text, encoding='utf-8')

      - name: Commit updater restoration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No updater source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-client/src/main/java/com/example/desktop/ElectricalWorkbenchNativeApp.java desktop-client/src/main/java/com/example/desktop/Launcher.java
          git commit -m "Restore continuous desktop update notifications"
          git push origin HEAD:main

name: Build Windows Desktop Client

on:
  workflow_dispatch:
  push:
    branches: [ main, development/functionality ]
    paths:
      - 'desktop-client/**'
      - '.github/workflows/build-desktop-client.yml'

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build client and collect dependencies
        shell: pwsh
        run: mvn -B clean package

      - name: Create MSI with jpackage
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          $channel = if ("${{ github.ref_name }}" -eq "development/functionality") { "development" } else { "stable" }
          New-Item -ItemType Directory -Force -Path target/installer | Out-Null
          jpackage `
            --type msi `
            --name RemoteJavaFXClient `
            --app-version $version `
            --vendor "Remote JavaFX Platform" `
            --description "Managed JavaFX desktop client" `
            --input target/jpackage-input `
            --main-jar remote-javafx-client-0.1.0.jar `
            --main-class com.example.desktop.Launcher `
            --java-options "-Dapp.version=$version" `
            --java-options "-Dapp.updateChannel=$channel" `
            --dest target/installer `
            --win-menu `
            --win-shortcut `
            --win-dir-chooser
          $msi = Get-ChildItem target/installer/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName target/installer/RemoteJavaFXClient-Setup.msi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteJavaFXClient-Windows
          path: desktop-client/target/installer/RemoteJavaFXClient-Setup.msi

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "0.1.${{ github.run_number }}"
          if ("${{ github.ref_name }}" -eq "development/functionality") {
            $tag = "client-dev-v$version"
            gh release create $tag target/installer/RemoteJavaFXClient-Setup.msi `
              --repo "${{ github.repository }}" `
              --target "development/functionality" `
              --title "Desktop Client DEV $version" `
              --notes "Development preview build. In-app updates stay on the development channel and follow client-dev prereleases. Uses the live cloud portal." `
              --prerelease
          } else {
            $tag = "client-v$version"
            gh release create $tag target/installer/RemoteJavaFXClient-Setup.msi `
              --repo "${{ github.repository }}" `
              --title "Desktop Client $version" `
              --notes "Stable Windows MSI build. In-app updates stay on the stable release channel. Default cloud portal: https://remote-javafx-portal.onrender.com" `
              --latest
          }

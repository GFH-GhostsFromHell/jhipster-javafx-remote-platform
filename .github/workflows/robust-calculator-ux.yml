name: Robust calculator UX migration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/robust-calculator-ux.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace raw calculator factors with user-friendly selections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('desktop-client/src/main/java/com/example/desktop/SectionedCalculatorPane.java')
          text = path.read_text()

          def replace_method(start_sig, next_sig, replacement):
              global text
              start = text.index(start_sig)
              end = text.index(next_sig, start)
              text = text[:start] + replacement.rstrip() + '\n\n    ' + text[end:]

          replace_method('    private Node section14() {', '    private Node section16() {', r'''    private Node section14() {
        TextField source=field("225"), amp=field("100"), length=field("3"), down=field("100"), customRatio=field("0.333333");
        ChoiceBox<String> ratio=choice("1/3 minimum (common tap worksheet)","1/3 minimum (common tap worksheet)","Custom ratio");
        return sectionTabs("Section 14 — Protection & Control", "Tap/splitter checks with user-friendly protection presets.", tab("Tap / Splitter",
            apiForm("Tap / splitter worksheet", "Choose the tap-rule ratio instead of entering a decimal multiplier. Custom remains available for a verified special condition.", "/tap", "Calculate tap check",
                () -> payload("sourceOcpd",number(source),"tapAmpacity",number(amp),"minimumRatio",ratio.getValue().startsWith("1/3")?1d/3d:number(customRatio),"lengthM",number(length),"downstreamOcpd",number(down),"edition","CEC_2024"),
                row("Source OCPD (A)",source),row("Tap conductor ampacity (A)",amp),row("Tap rule / minimum ratio",ratio),row("Custom ratio (advanced)",customRatio),row("Tap length (m)",length),row("Downstream OCPD (A)",down))));
    }''')

          replace_method('    private Node transformer() {', '    private Node dryTransformer() {', r'''    private Node transformer() {
        TextField kva=field("75"), pv=field("600"), sv=field("208"), customDesign=field("1.25"), customPrimary=field("1.25"), customSecondary=field("1.25");
        ChoiceBox<Integer> ph=phaseChoice(3);
        ChoiceBox<String> design=choice("125% design ampacity","125% design ampacity","100% design ampacity","Custom");
        ChoiceBox<String> primary=choice("125% primary protection preset","125% primary protection preset","150% primary protection preset","200% primary protection preset","300% primary protection preset","Custom");
        ChoiceBox<String> secondary=choice("125% secondary protection preset","125% secondary protection preset","150% secondary protection preset","200% secondary protection preset","300% secondary protection preset","Custom");
        return apiForm("Transformer sizing", "Primary/secondary current, conductor design ampacity and OCPD worksheet. Select a readable protection preset; use Custom only after confirming the applicable CEC transformer arrangement.", "/transformer", "Calculate transformer",
            ()->payload("kva",number(kva),"primaryVoltage",number(pv),"secondaryVoltage",number(sv),"phases",ph.getValue(),
                "designFactor",percentPreset(design.getValue(),customDesign),"primaryOcpdFactor",percentPreset(primary.getValue(),customPrimary),"secondaryOcpdFactor",percentPreset(secondary.getValue(),customSecondary),"edition","CEC_2024"),
            row("Transformer kVA",kva),row("Primary voltage",pv),row("Secondary voltage",sv),row("System",systemChoice(ph)),row("Conductor design basis",design),row("Primary protection basis",primary),row("Secondary protection basis",secondary),
            row("Custom design factor (advanced)",customDesign),row("Custom primary factor (advanced)",customPrimary),row("Custom secondary factor (advanced)",customSecondary));
    }''')

          replace_method('    private Node hvTransformer(boolean high) {', '    private Node capacitorWorksheet() {', r'''    private Node hvTransformer(boolean high) {
        TextField mva=field(high?"10":"2.5"), pk=field(high?"44":"13.8"), sk=field(high?"27.6":"7.2"), customFactor=field("3.0");
        ChoiceBox<String> protection=choice("Circuit breaker","Circuit breaker","Fuse"), factorPreset=choice("300% protection calculation preset","300% protection calculation preset","250% protection calculation preset","200% protection calculation preset","150% protection calculation preset","125% protection calculation preset","Custom");
        ChoiceBox<String> material=choice(high?"Copper":"Aluminum","Copper","Aluminum"), wiring=choice(high?"Buried conduit":"Outdoor ventilated tray","Buried conduit","Outdoor ventilated tray"), vclass=choice(high?"25–46 kV":"5–15 kV","5–15 kV","25–46 kV");
        return apiForm((high?"High":"Medium")+"-voltage transformer worksheet", "Current, protection and conductor/raceway worksheet. Human-readable selections are converted to the backend table keys automatically.", "/transformer-hv-worksheet", "Calculate transformer",
            ()->payload("mva",number(mva),"primaryKv",number(pk),"secondaryKv",number(sk),"protection",protection.getValue().startsWith("Fuse")?"FUSE":"BREAKER","protectionFactor",percentPreset(factorPreset.getValue(),customFactor),
                "material",material.getValue().equals("Copper")?"COPPER":"ALUMINUM","wiringMethod",wiring.getValue().startsWith("Buried")?"BURIED_CONDUIT":"OUTDOOR_VENTILATED_TRAY","voltageClass",vclass.getValue().startsWith("5")?"5-15_KV":"25-46_KV"),
            row("Rating (MVA)",mva),row("Primary (kV)",pk),row("Secondary (kV)",sk),row("Protection device",protection),row("Protection calculation preset",factorPreset),row("Custom protection factor (advanced)",customFactor),row("Conductor material",material),row("Wiring method",wiring),row("Voltage class",vclass));
    }''')

          replace_method('    private Node pfCorrection() {', '    private Node section28() {', r'''    private Node pfCorrection() {
        TextField kw=field("100"), old=field("0.75"), target=field("0.95"), voltage=field("600"), customCf=field("1.35"), customOf=field("1.65"); ChoiceBox<Integer> ph=phaseChoice(3);
        ChoiceBox<String> preset=choice("CEC capacitor worksheet preset — 135% conductor / 165% OCPD","CEC capacitor worksheet preset — 135% conductor / 165% OCPD","Custom factors");
        return apiForm("Power-factor correction", "Required kVAR, capacitor current, conductor and OCPD worksheet. The normal path selects the capacitor sizing preset rather than asking for raw multipliers.", "/capacitor-bank", "Calculate PF correction",
            ()->payload("kw",number(kw),"existingPf",number(old),"targetPf",number(target),"voltage",number(voltage),"phases",ph.getValue(),
                "conductorFactor",preset.getValue().startsWith("CEC")?1.35:number(customCf),"ocpdFactor",preset.getValue().startsWith("CEC")?1.65:number(customOf),"edition","CEC_2024"),
            row("Load (kW)",kw),row("Existing power factor",old),row("Target power factor",target),row("Voltage",voltage),row("System",systemChoice(ph)),row("Sizing method",preset),row("Custom conductor factor (advanced)",customCf),row("Custom OCPD factor (advanced)",customOf));
    }''')

          replace_method('    private Node motor(boolean dc) {', '    private Node multiMotor() {', r'''    private Node motor(boolean dc) {
        TextField flc=field(dc?"40":"34"), hp=field(dc?"25":"20"), lockedRotor=field("");
        ChoiceBox<String> acType=choice("Squirrel-cage / synchronous — full-voltage, resistor or reactor","Single-phase AC — all types","Squirrel-cage / synchronous — full-voltage, resistor or reactor","Squirrel-cage / synchronous — autotransformer or star-delta","Wound-rotor AC");
        ChoiceBox<String> dcType=choice("Shunt","Shunt","Series","Cumulative compound","Differential compound","Permanent-magnet","Separately excited");
        ChoiceBox<String> protection=choice("Time-delay fuse","Time-delay fuse","Non-time-delay fuse","Inverse-time circuit breaker","Instantaneous-trip (magnetic only) — FLC method","Instantaneous-trip (magnetic only) — locked-rotor method");
        ChoiceBox<String> overload=choice("Service factor ≥ 1.15 — overload at 125% FLC","Service factor ≥ 1.15 — overload at 125% FLC","Service factor < 1.15 or unknown — overload at 115% FLC");
        ChoiceBox<String> disconnect=choice("Moulded-case switch / circuit breaker — 115% FLC","Moulded-case switch / circuit breaker — 115% FLC","General-use AC switch, single-phase — 125% FLC");
        Node form=apiForm((dc?"DC":"AC")+" motor branch worksheet", "Select the motor and protective-device type; the app applies the CEC 2024 Table 29 / Rule 28-210 factor automatically. Overload selection follows Rule 28-306 and disconnect current follows Rule 28-602.", "/motor", "Calculate motor",
            ()->{double f=number(flc);double o=motorOcpdFactor(dc,dc?dcType.getValue():acType.getValue(),protection.getValue(),f,optionalNumber(lockedRotor),number(hp));return payload("flc",f,"conductorFactor",1.25,"overloadFactor",overload.getValue().contains("125%")?1.25:1.15,"ocpdFactor",o,"disconnectFactor",disconnect.getValue().contains("125%")?1.25:1.15,"edition","CEC_2024");},
            row("Full-load current / nameplate FLA (A)",flc),row("Motor horsepower",hp),row(dc?"DC motor type":"AC motor / starting type",dc?dcType:acType),row("Branch OCPD type",protection),row("Locked-rotor current (A; only for LRC method)",lockedRotor),row("Motor overload selection",overload),row("Disconnect type",disconnect));
        return form;
    }''')

          replace_method('    private Node multiMotor() {', '    private Node refrigerationWorksheet() {', r'''    private Node multiMotor() {
        TextField flcs=field("42,27,20,10"), extra=field("0");
        ChoiceBox<String> largestType=choice("Squirrel-cage / synchronous — full-voltage, resistor or reactor","Single-phase AC — all types","Squirrel-cage / synchronous — full-voltage, resistor or reactor","Squirrel-cage / synchronous — autotransformer or star-delta","Wound-rotor AC");
        ChoiceBox<String> protection=choice("Time-delay fuse","Time-delay fuse","Non-time-delay fuse","Inverse-time circuit breaker");
        ChoiceBox<String> starting=choice("Motors do not require simultaneous-start allowance","Motors do not require simultaneous-start allowance","Simultaneous starting — include entered extra amperes");
        return apiForm("Multiple motors", "Enter the motor FLCs, then identify the largest motor and its branch protective device. The Table 29 factor is selected automatically instead of entered as a decimal.", "/multi-motor", "Calculate multi-motor feeder",
            ()->{List<Double> values=csvD(flcs.getText());if(values.isEmpty())throw new IllegalArgumentException("Enter at least one motor FLC");double largest=values.stream().mapToDouble(Double::doubleValue).max().orElseThrow();double of=motorOcpdFactor(false,largestType.getValue(),protection.getValue(),largest,null,0);return payload("flcs",values,"largestConductorFactor",1.25,"largestBranchOcpdFactor",of,"simultaneousStartExtra",starting.getValue().startsWith("Simultaneous")?number(extra):0,"edition","CEC_2024");},
            row("Motor FLCs (A, comma-separated)",flcs),row("Largest motor / starting type",largestType),row("Largest motor OCPD type",protection),row("Starting condition",starting),row("Simultaneous-start extra amperes",extra));
    }''')

          replace_method('    private Node refrigerationDetailed() {', '    private Node section32() {', r'''    private Node refrigerationDetailed() {
        TextField rla=field("28"), mca=field(""), mocp=field("");
        ChoiceBox<String> overload=choice("Current-responsive overload relay — max 140% RLA","Current-responsive overload relay — max 140% RLA","Other overload device / fuse — max 125% RLA");
        return apiForm("Refrigeration / compressor nameplate worksheet", "Enter nameplate MCA/MOCP when available. If they are not marked, the worksheet uses the existing branch-circuit fallback while the overload selection follows the motor-compressor choices in Rule 28-710.", "/refrigeration", "Calculate refrigeration circuit",
            ()->payload("rla",number(rla),"mca",optionalNumber(mca),"mocp",optionalNumber(mocp),"conductorFactor",1.25,"ocpdFactor",1.75,"overloadFactor",overload.getValue().contains("140%")?1.40:1.25,"edition","CEC_2024"),
            row("Rated-load current / RLA (A)",rla),row("Nameplate MCA (optional — preferred)",mca),row("Nameplate MOCP (optional — preferred)",mocp),row("Overload device type",overload));
    }''')

          replace_method('    private Node singleWelder() {', '    private Node multipleWelders() {', r'''    private Node singleWelder() {
        ChoiceBox<String> type=choice("Transformer / inverter arc welder","Transformer / inverter arc welder","Resistance welder");
        ChoiceBox<String> duty=choice("60%","100%","90%","80%","70%","60%","50%","40%","30%","20%","1 hour");
        TextField kva=field("30"), voltage=field("600"), amp=field("35");
        type.setOnAction(e->{duty.getItems().clear();if(type.getValue().startsWith("Resistance")){duty.getItems().addAll("50%","40%","30%","25%","20%","15%","10%","7.5%","5%");duty.setValue("30%");}else{duty.getItems().addAll("100%","90%","80%","70%","60%","50%","40%","30%","20%","1 hour");duty.setValue("60%");}});
        return apiForm("Single welder worksheet", "Choose the welder type and nameplate duty cycle. The app converts the selection to the CEC 2024 Table 42A or 42C conductor multiplier automatically.", "/welder-worksheet", "Calculate single welder",
            ()->payload("kva",number(kva),"voltage",number(voltage),"dutyFactor",welderDutyFactor(type.getValue(),duty.getValue()),"type",type.getValue().startsWith("Resistance")?"RESISTANCE":"TRANSFORMER_ARC","selectedConductorAmpacity",number(amp)),
            row("Welder type",type),row("Rating (kVA)",kva),row("Primary voltage (V)",voltage),row("Nameplate duty cycle",duty),row("Selected conductor ampacity (A)",amp));
    }''')

          helper_marker = '    private Button button(String text){Button b=new Button(text);b.setStyle(PRIMARY);return b;}'
          helpers = r'''    private Node systemChoice(ChoiceBox<Integer> phases){
        Label l=new Label(phases.getValue()==3?"3-phase":"1-phase");
        l.setStyle("-fx-background-color:#f8fafc;-fx-border-color:#cbd5e1;-fx-border-radius:8;-fx-background-radius:8;-fx-padding:9 10;-fx-text-fill:#334155;");
        phases.setOnAction(e->l.setText(phases.getValue()==3?"3-phase":"1-phase"));
        l.setOnMouseClicked(e->phases.show());
        return phases;
    }

    private double percentPreset(String label,TextField custom){
        if(label==null||label.startsWith("Custom"))return number(custom);
        java.util.regex.Matcher m=java.util.regex.Pattern.compile("(\\d+(?:\\.\\d+)?)%").matcher(label);
        if(!m.find())throw new IllegalArgumentException("No percentage found in selected preset");
        return Double.parseDouble(m.group(1))/100.0;
    }

    private double motorOcpdFactor(boolean dc,String motorType,String device,double flc,Double lockedRotor,double hp){
        if(device.startsWith("Instantaneous-trip")){
            if(dc)return hp<=50?2.50:2.00;
            if(device.contains("locked-rotor")){
                if(lockedRotor==null||lockedRotor<=0)throw new IllegalArgumentException("Enter the motor locked-rotor current for the locked-rotor instantaneous-trip method");
                return (2.15*lockedRotor)/flc;
            }
            return 13.00;
        }
        if(dc)return 1.50;
        boolean td=device.startsWith("Time-delay");
        boolean ntd=device.startsWith("Non-time-delay");
        if(motorType.startsWith("Wound-rotor"))return 1.50;
        if(motorType.contains("autotransformer")||motorType.contains("star-delta")){
            if(td)return 1.75;
            if(flc<=30)return ntd?2.50:2.00;
            return 2.00;
        }
        if(td)return 1.75;
        if(ntd)return 3.00;
        return 2.50;
    }

    private double welderDutyFactor(String type,String duty){
        String d=duty==null?"":duty.trim();
        if(type.startsWith("Resistance")){
            return switch(d){case "50%"->.71;case "40%"->.63;case "30%"->.55;case "25%"->.50;case "20%"->.45;case "15%"->.39;case "10%"->.32;case "7.5%"->.27;case "5%"->.22;default->throw new IllegalArgumentException("Select a resistance-welder duty cycle");};
        }
        return switch(d){case "100%"->1.00;case "90%"->.95;case "80%"->.89;case "70%"->.84;case "60%"->.78;case "50%"->.71;case "40%"->.63;case "30%"->.55;case "20%"->.45;case "1 hour"->.75;default->throw new IllegalArgumentException("Select an arc-welder duty cycle");};
    }

'''
          text = text.replace(helper_marker, helpers + helper_marker)
          path.write_text(text)
          PY

      - name: Compile desktop client
        shell: bash
        run: mvn -q -f desktop-client/pom.xml -DskipTests package

      - name: Commit calculator UX upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-client/src/main/java/com/example/desktop/SectionedCalculatorPane.java
          git commit -m "Make calculators selection-driven and user friendly"
          git push origin main

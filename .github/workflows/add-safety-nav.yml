name: Integrate Safety workspace into desktop shell
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/add-safety-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Safety navigation and home tile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-client/src/main/java/com/example/desktop/ElectricalWorkbenchNativeApp.java')
          s=p.read_text(encoding='utf-8')
          old='Button home=navButton("⌂  Home"), calculators=navButton("🧮  Workbench"), learn=navButton("🎓  Learn"), field=navButton("🛠  Field"), projects=navButton("📁  Projects"), career=navButton("📈  Career"), news=navButton("⚡  Code News"), profile=navButton("👤  Profile");'
          new='Button home=navButton("⌂  Home"), calculators=navButton("🧮  Workbench"), learn=navButton("🎓  Learn"), field=navButton("🛠  Field"), safety=navButton("🦺  Safety"), projects=navButton("📁  Projects"), career=navButton("📈  Career"), news=navButton("⚡  Code News"), profile=navButton("👤  Profile");'
          if old not in s: raise SystemExit('nav declaration target not found')
          s=s.replace(old,new,1)
          old='nav.getChildren().addAll(navTitle,home,calculators,learn,field,projects,career,news,profile);root.setLeft(nav);'
          new='nav.getChildren().addAll(navTitle,home,calculators,learn,field,safety,projects,career,news,profile);root.setLeft(nav);'
          if old not in s: raise SystemExit('nav children target not found')
          s=s.replace(old,new,1)
          old='field.setOnAction(e->setWorkspace(buildPlatform("Field")));projects.setOnAction(e->setWorkspace(buildPlatform("Projects")));'
          new='field.setOnAction(e->setWorkspace(buildPlatform("Field")));safety.setOnAction(e->setWorkspace(buildSafety()));projects.setOnAction(e->setWorkspace(buildPlatform("Projects")));'
          if old not in s: raise SystemExit('action target not found')
          s=s.replace(old,new,1)
          old='tile("🛠 Field Tools","Troubleshooting, nameplates, commissioning, inspection, blueprint scaling, fault current and grounding wizard",()->setWorkspace(buildPlatform("Field"))),\n            tile("📁 Project Workspace"'
          new='tile("🛠 Field Tools","Troubleshooting, nameplates, commissioning, inspection, blueprint scaling, fault current and grounding wizard",()->setWorkspace(buildPlatform("Field"))),\n            tile("🦺 Electrical Safety","PPE rating checks, approach-distance planning, unsafe-condition photos, glove testing and safety-equipment maintenance",()->setWorkspace(buildSafety())),\n            tile("📁 Project Workspace"'
          if old not in s: raise SystemExit('home tile target not found')
          s=s.replace(old,new,1)
          old='private Node buildCalculators(){return new NativeCalculatorPane(portal,json,currentUsername,currentPassword);}\n    private Node buildPlatform(String area){return new ElectricianPlatformPane(json,currentUsername,area);}'
          new='private Node buildCalculators(){return new NativeCalculatorPane(portal,json,currentUsername,currentPassword);}\n    private Node buildSafety(){return new SafetyPane(json,currentUsername);}\n    private Node buildPlatform(String area){return new ElectricianPlatformPane(json,currentUsername,area);}'
          if old not in s: raise SystemExit('builder target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-client/src/main/java/com/example/desktop/ElectricalWorkbenchNativeApp.java
          git commit -m "Add Safety workspace to native JavaFX navigation"
          git push origin main

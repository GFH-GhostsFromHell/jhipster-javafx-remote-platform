name: Improve conduit bender mobile visuals

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-bend-visualizer-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Improve bend visualizer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('portal/src/main/resources/static/bend-calcs.html')
          x=p.read_text(encoding='utf-8')

          old='.diagram{background:#eef4df;border-radius:14px;padding:6px;min-height:330px;display:grid;place-items:center;overflow:hidden}.diagram svg{width:100%;height:auto;max-height:420px}'
          new='.diagram{background:linear-gradient(180deg,#f2f7eb,#e2ebdc);border:1px solid #9daf9f;border-radius:16px;padding:14px;min-height:360px;display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 1px 0 #fff,0 10px 26px #0002}.diagram svg{width:100%;height:auto;max-height:440px;overflow:visible}.diagram svg text{font-family:Inter,Segoe UI,system-ui,sans-serif;font-size:19px!important;font-weight:800;paint-order:stroke fill;stroke:#f3f7ed;stroke-width:7px;stroke-linejoin:round}.diagram svg .axis-label{font-size:17px!important}'
          if old not in x: raise SystemExit('diagram css marker not found')
          x=x.replace(old,new,1)

          old='.markbar{position:relative;height:116px;background:#07131f;border:1px solid #29445e;border-radius:12px;overflow:hidden}.pipe{position:absolute;left:5%;right:5%;top:61px;height:14px;border:1px solid #92a5b7;background:linear-gradient(#d2d9df,#8e9aa5);border-radius:7px}.tick{position:absolute;top:45px;width:2px;height:44px;background:var(--green)}.tick label{position:absolute;top:-27px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:900;color:#eaf4ff;font-size:12px}.tick i{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-style:normal;color:#04111f;font-size:11px;font-weight:900}'
          new='.markbar{position:relative;height:92px;background:#07131f;border:1px solid #29445e;border-radius:12px;overflow:hidden}.pipe{position:absolute;left:5%;right:5%;top:42px;height:16px;border:1px solid #b7c6d1;background:linear-gradient(180deg,#f4f8fb 0%,#c8d2da 28%,#7c8c98 70%,#5f6f7b 100%);border-radius:8px;box-shadow:0 7px 12px #0005}.tick{position:absolute;top:27px;width:3px;height:47px;background:var(--green);box-shadow:0 0 8px #5eead477}.tick i{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-style:normal;color:#04111f;font-size:11px;font-weight:950;background:#dffdf4;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center}.marklegend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.markitem{display:flex;align-items:center;gap:9px;background:#0a1b2b;border:1px solid #29445e;border-radius:10px;padding:9px 11px;color:#dceaf5;font-size:12px}.markitem b{display:grid;place-items:center;min-width:25px;height:25px;border-radius:999px;background:#dffdf4;color:#05251d}.markitem span{font-weight:800;color:#f4f8fb}'
          if old not in x: raise SystemExit('mark css marker not found')
          x=x.replace(old,new,1)

          old='@media(max-width:760px){.wrap{padding:14px}.menu{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.inputs{grid-template-columns:1fr}.wide{grid-column:auto}.diagram{min-height:270px}.toplinks a:first-child{display:none}.result strong{font-size:19px}.bendbtn{grid-template-columns:62px 1fr}}'
          new='@media(max-width:760px){.wrap{padding:12px}.menu{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.inputs{grid-template-columns:1fr}.wide{grid-column:auto}.diagram{min-height:285px;padding:8px}.diagram svg text{font-size:15px!important;stroke-width:5px}.diagram svg .axis-label{font-size:14px!important}.toplinks a:first-child{display:none}.result strong{font-size:18px}.results{grid-template-columns:1fr 1fr}.bendbtn{grid-template-columns:62px 1fr}.tooltitle{font-size:20px;line-height:1.15}.backrow{align-items:flex-start;flex-wrap:wrap}.marklegend{grid-template-columns:1fr}.card{padding:13px}.formula{font-size:11px}}@media(max-width:430px){.results{grid-template-columns:1fr}.top{padding:10px 12px}.brand b{font-size:15px}.brand span{font-size:9px}.toplinks a:last-child{font-size:11px;padding:8px}.hero h1{font-size:28px}}'
          if old not in x: raise SystemExit('mobile css marker not found')
          x=x.replace(old,new,1)

          marks_new=r'''function marks(labels){const entries=Object.entries(labels).filter(([,x])=>Number.isFinite(x));if(!entries.length)return '';let min=Math.min(0,...entries.map(x=>x[1])),max=Math.max(...entries.map(x=>x[1]));if(max-min<1)max=min+1;return `<div class="markcard card"><h3>Marks on straight conduit</h3><div class="markbar"><div class="pipe"></div>${entries.map(([k,x])=>{let p=5+90*(x-min)/(max-min);return `<div class="tick" style="left:${p}%"><i>${k}</i></div>`}).join('')}</div><div class="marklegend">${entries.map(([k,x])=>`<div class="markitem"><b>${k}</b><div><small>MEASURE FROM ZERO</small><br><span>${L(x)}</span></div></div>`).join('')}</div><div class="note">The pipe drawing only shows mark letters so labels cannot overlap. Use the measurement cards above for the exact distance from the same zero/reference end.</div></div>`}function result'''
          x,n=re.subn(r'function marks\(labels\)\{.*?\}function result',marks_new,x,count=1,flags=re.S)
          if n!=1: raise SystemExit('marks function marker not found')

          line_new=r'''function lineSvg(points,labels='',extra=''){return `<svg viewBox="0 0 700 360" role="img" aria-label="Conduit bend diagram"><defs><linearGradient id="pipeMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f7fbff"/><stop offset="24%" stop-color="#dbe4ea"/><stop offset="55%" stop-color="#9aa9b5"/><stop offset="78%" stop-color="#687985"/><stop offset="100%" stop-color="#4d5e69"/></linearGradient><filter id="pipeShadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="8" dy="11" stdDeviation="7" flood-color="#1d2a34" flood-opacity=".30"/></filter></defs><rect width="700" height="360" rx="18" fill="#edf4e6"/><g opacity=".20" stroke="#6f8a81" stroke-width="1"><path d="M0 300L700 300M0 250L700 250M0 200L700 200M0 150L700 150M0 100L700 100"/><path d="M80 360L270 0M210 360L400 0M340 360L530 0M470 360L660 0"/></g><path d="${points}" fill="none" stroke="#43535e" stroke-width="31" stroke-linecap="round" stroke-linejoin="round" filter="url(#pipeShadow)"/><path d="${points}" fill="none" stroke="url(#pipeMetal)" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/><path d="${points}" fill="none" stroke="#ffffff" stroke-opacity=".58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -4)"/>${extra}${labels}</svg>`}function offsetSvg'''
          x,n=re.subn(r'function lineSvg\(points,labels=\'\',extra=\'\'\)\{.*?\}function offsetSvg',line_new,x,count=1,flags=re.S)
          if n!=1: raise SystemExit('lineSvg marker not found')

          # Simplify diagram labels and add a dedicated perspective rolling-offset drawing.
          x=x.replace("function offsetSvg(o,spacing,shrink,isRoll=false){return lineSvg('M55 280 H220 L420 105 H650',`<text x=\"82\" y=\"330\" fill=\"#7444aa\" font-size=\"24\">reference / zero</text><text x=\"250\" y=\"87\" fill=\"#15a05a\" font-size=\"30\">Bend spacing ${L(spacing)}</text><text x=\"480\" y=\"145\" fill=\"#075bc7\" font-size=\"28\">${isRoll?'True offset':'Offset'} ${L(o)}</text><text x=\"465\" y=\"300\" fill=\"#111\" font-size=\"24\">Shrink ${L(shrink)}</text>`,`<line x1=\"230\" y1=\"270\" x2=\"408\" y2=\"112\" stroke=\"#15a05a\" stroke-width=\"3\"/><line x1=\"430\" y1=\"105\" x2=\"430\" y2=\"280\" stroke=\"#075bc7\" stroke-width=\"3\"/>`)}",
          "function offsetSvg(o,spacing,shrink,isRoll=false){return lineSvg('M55 280 H220 L420 105 H650',`<text x=\"70\" y=\"325\" fill=\"#6a3e91\">ZERO</text><text x=\"255\" y=\"72\" fill=\"#087a48\">Spacing ${L(spacing)}</text><text x=\"492\" y=\"155\" fill=\"#075bc7\">${isRoll?'True offset':'Offset'} ${L(o)}</text>`,`<line x1=\"230\" y1=\"270\" x2=\"408\" y2=\"112\" stroke=\"#0b9a5a\" stroke-width=\"3\"/><line x1=\"430\" y1=\"105\" x2=\"430\" y2=\"280\" stroke=\"#0d68c7\" stroke-width=\"3\" stroke-dasharray=\"8 7\"/>`)}function rollSvg(rise,roll,T,spacing){return lineSvg('M55 285 H205 L392 116 L650 142',`<text x=\"250\" y=\"72\" fill=\"#087a48\">Spacing ${L(spacing)}</text><text x=\"485\" y=\"105\" fill=\"#075bc7\">True offset ${L(T)}</text>`,`<g fill=\"none\" stroke-width=\"3\" stroke-dasharray=\"8 7\"><line x1=\"392\" y1=\"116\" x2=\"392\" y2=\"285\" stroke=\"#0d68c7\"/><line x1=\"392\" y1=\"285\" x2=\"520\" y2=\"322\" stroke=\"#8a4db0\"/></g><text class=\"axis-label\" x=\"405\" y=\"205\" fill=\"#075bc7\">Rise ${L(rise)}</text><text class=\"axis-label\" x=\"505\" y=\"335\" fill=\"#713f91\">Roll ${L(roll)}</text>`)}")

          old_calc="document.getElementById('diagram').innerHTML=offsetSvg(T,S,sh,true);"
          if old_calc not in x: raise SystemExit('roll diagram marker not found')
          x=x.replace(old_calc,"document.getElementById('diagram').innerHTML=rollSvg(r,q,T,S);",1)

          p.write_text(x,encoding='utf-8')
          PY
      - name: Commit conduit bender improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/src/main/resources/static/bend-calcs.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve conduit bender mobile layout and 3D visuals"
          git push origin HEAD:main

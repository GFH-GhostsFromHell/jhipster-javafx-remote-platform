name: Fix electrical news ordering

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-news-sort.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep undated items below dated items
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portal/src/main/java/com/example/remoteportal/service/ElectricalNewsService.java')
          x=p.read_text(encoding='utf-8')
          old='''        sorted.sort(Comparator\n            .comparing(NewsItem::sortDate, Comparator.nullsLast(Comparator.naturalOrder()))\n            .reversed()\n            .thenComparing(NewsItem::title));'''
          new='''        sorted.sort((a, b) -> {\n            if (a.sortDate() == null && b.sortDate() == null) return a.title().compareToIgnoreCase(b.title());\n            if (a.sortDate() == null) return 1;\n            if (b.sortDate() == null) return -1;\n            int dateOrder = b.sortDate().compareTo(a.sortDate());\n            return dateOrder != 0 ? dateOrder : a.title().compareToIgnoreCase(b.title());\n        });'''
          if old not in x: raise SystemExit('sort marker not found')
          p.write_text(x.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit sort fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/src/main/java/com/example/remoteportal/service/ElectricalNewsService.java
          git commit -m "Keep undated news below dated bulletins"
          git push origin HEAD:main

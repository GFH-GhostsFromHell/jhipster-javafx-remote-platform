name: Build Web Portal

on:
  push:
    branches:
      - main
      - development/functionality
    paths:
      - 'portal/**'
      - 'scripts/validate-field-tools.cjs'
      - 'scripts/validate-tool-navigation.cjs'
      - 'scripts/validate-account-sync.cjs'
      - 'scripts/validate-conductor-data-audit.cjs'
      - 'scripts/validate-circuit-sizing.cjs'
      - 'scripts/validate-project-circuit-archive.cjs'
      - 'scripts/validate-circuit-sync-restore.cjs'
      - 'scripts/validate-cec-evidence-and-reports.cjs'
      - 'scripts/verify-live-portal.cjs'
      - 'scripts/test-live-release.cjs'
      - 'scripts/validate-industrial-commissioning.cjs'
      - '.github/workflows/verify-production-release.yml'
      - 'docs/CEC2024_TABLE_VERIFICATION_REGISTER.json'
      - 'Dockerfile.portal'
      - '.github/workflows/build-portal.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'portal/**'
      - 'scripts/validate-field-tools.cjs'
      - 'scripts/validate-tool-navigation.cjs'
      - 'scripts/validate-account-sync.cjs'
      - 'scripts/validate-conductor-data-audit.cjs'
      - 'scripts/validate-circuit-sizing.cjs'
      - 'scripts/validate-project-circuit-archive.cjs'
      - 'scripts/validate-circuit-sync-restore.cjs'
      - 'scripts/validate-cec-evidence-and-reports.cjs'
      - 'scripts/verify-live-portal.cjs'
      - 'scripts/test-live-release.cjs'
      - 'scripts/validate-industrial-commissioning.cjs'
      - '.github/workflows/verify-production-release.yml'
      - 'docs/CEC2024_TABLE_VERIFICATION_REGISTER.json'
      - 'Dockerfile.portal'
      - '.github/workflows/build-portal.yml'

permissions:
  contents: read

jobs:
  portal-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate static field tools and troubleshooting KB
        run: node scripts/validate-field-tools.cjs
      - name: Validate clear cross-platform tool names and quick links
        run: node scripts/validate-tool-navigation.cjs
      - name: Validate account sync and offline conflict handling
        run: node scripts/validate-account-sync.cjs
      - name: Audit conductor source-data parity and offline formula wiring
        run: node scripts/validate-conductor-data-audit.cjs
      - name: Validate unified Android and web circuit sizing
        run: node scripts/validate-circuit-sizing.cjs
      - name: Validate project worksheet revisions, backup and native links
        run: node scripts/validate-project-circuit-archive.cjs
      - name: Validate account-scoped cross-device circuit sync and restore
        run: node scripts/validate-circuit-sync-restore.cjs
      - name: Audit CEC table evidence and printable PDF metadata
        run: node scripts/validate-cec-evidence-and-reports.cjs
      - name: Test live-deployment smoke verifier (local fixtures)
        run: node scripts/test-live-release.cjs
      - name: Validate industrial CT/PT relay worksheets and four-platform field presets
        run: node scripts/validate-industrial-commissioning.cjs
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package portal
        run: mvn -B -f portal/pom.xml package

# Trigger: calculator selection parity across Web, Windows and Android.

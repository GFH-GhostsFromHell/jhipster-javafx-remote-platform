name: Apply robust calculator UX

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/robust_calculator_patch.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply calculator UX patch
        run: python .github/scripts/robust_calculator_patch.py
      - name: Compile desktop client
        run: mvn -q -f desktop-client/pom.xml -DskipTests package
      - name: Commit upgraded calculator UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-client/src/main/java/com/example/desktop/SectionedCalculatorPane.java
          git commit -m "Make calculators selection-driven and user friendly"
          git push origin main

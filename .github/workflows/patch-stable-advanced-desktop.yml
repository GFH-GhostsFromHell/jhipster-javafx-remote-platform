name: Patch stable desktop advanced calculators
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-stable-advanced-desktop.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy advanced calculator view and wire stable rail
        run: |
          git fetch origin development/functionality:refs/remotes/origin/development/functionality
          git show origin/development/functionality:desktop-client/src/main/java/com/example/desktop/AdvancedCalculationViews.java > desktop-client/src/main/java/com/example/desktop/AdvancedCalculationViews.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('desktop-client/src/main/java/com/example/desktop/SectionedCalculatorPane.java')
          x=p.read_text()
          marker='''        addSectionButton(rail, "Section 42 — Welders", this::section42);'''
          replacement=marker+'''\n        addSectionButton(rail, "ADV — Advanced Calculations", AdvancedCalculationViews::create);'''
          if marker not in x: raise SystemExit('stable calculator rail marker missing')
          p.write_text(x.replace(marker,replacement,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop-client/src/main/java/com/example/desktop/AdvancedCalculationViews.java desktop-client/src/main/java/com/example/desktop/SectionedCalculatorPane.java
          git commit -m 'Add advanced calculations to stable desktop workspace'
          git push origin HEAD:main

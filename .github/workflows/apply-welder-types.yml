name: Apply three CEC welder types

on:
  push:
    branches: [ main ]
    paths:
      - '.github/fix_welder_types.py'
      - '.github/workflows/apply-welder-types.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply welder type patch
        run: python .github/fix_welder_types.py
      - name: Compile portal
        run: mvn -f portal/pom.xml -DskipTests package
      - name: Compile desktop client
        run: mvn -f desktop-client/pom.xml -DskipTests package
      - name: Commit permanent source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add portal/src/main/java/com/example/remoteportal/web/CalculatorResource.java \
                  portal/src/main/java/com/example/remoteportal/service/WorksheetCalculatorService.java \
                  portal/src/main/resources/static/calculators.html \
                  desktop-client/src/main/java/com/example/desktop/SectionedCalculatorPane.java
          git diff --cached --quiet && exit 0
          git commit -m 'Support all three CEC welder categories'
          git push origin main

name: Fix platform compile typo
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-platform-compile.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix ObservableList addAll call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('desktop-client/src/main/java/com/example/desktop/ElectricianPlatformPane.java')
          s=p.read_text(encoding='utf-8')
          old='root.getChildren().add(cardForm("Credential",'
          new='root.getChildren().addAll(cardForm("Credential",'
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-client/src/main/java/com/example/desktop/ElectricianPlatformPane.java
          git commit -m "Fix credential wallet JavaFX addAll call"
          git push origin main

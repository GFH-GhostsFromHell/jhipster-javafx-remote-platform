name: Patch web busbar and cable strap tools

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-busbar-web.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch calculator workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('portal/src/main/resources/static/calculators.html')
          x = p.read_text(encoding='utf-8')

          old_sections = "const sections=[['s2','Section 2','General Rules'],['s8','Section 8','Service & Demand'],['s12','Section 12','Wiring Methods'],['s14','Section 14','Protection / Taps'],['s16','Section 16','Class 1 & Class 2'],['s24','Section 24','Patient Care'],['s26','Section 26','Transformers / Capacitors'],['s28','Section 28','Motors / Refrigeration'],['s32','Section 32','Fire Alarm / Fire Pumps'],['s42','Section 42','Welders']];"
          new_sections = "const sections=[['s2','Section 2','General Rules'],['s4','Section 4','Conductors / Busbars'],['s8','Section 8','Service & Demand'],['s12','Section 12','Wiring Methods'],['s14','Section 14','Protection / Taps'],['s16','Section 16','Class 1 & Class 2'],['s24','Section 24','Patient Care'],['s26','Section 26','Transformers / Capacitors'],['s28','Section 28','Motors / Refrigeration'],['s32','Section 32','Fire Alarm / Fire Pumps'],['s42','Section 42','Welders']];"
          if old_sections not in x:
              raise SystemExit('sections marker not found')
          x = x.replace(old_sections, new_sections, 1)

          busbar_panes = r'''window.s4Panes=[];
          s4Panes.push(work(card('Dimensions → ampacity',`<div class="grid">${select('Material','bb_mat',['Copper','Aluminum'],'Copper')}${field('Width mm','bb_w',50)}${field('Thickness mm','bb_t',6)}</div><p class="note">Worksheet Rule 4-036 method: area = width × thickness; copper uses 1000 A/in² and aluminum 700 A/in². The practice method uses 645 mm² ≈ 1 in².</p>`),btn('Calculate busbar ampacity','calcBusDim()'),'o_bb_dim'));
          s4Panes.push(work(card('Current → required bar size',`<div class="grid">${select('Material','bs_mat',['Copper','Aluminum'],'Copper')}${field('Target current A','bs_i',1200)}${field('Known thickness mm','bs_t',6)}${field('Known width mm','bs_w',100)}</div><p class="note">Calculates required cross-sectional area, then required width for the entered thickness and required thickness for the entered width.</p>`),btn('Calculate required busbar size','calcBusSize()'),'o_bb_size'));
          s4Panes.push(work(card('Parallel straps / bars',`<div class="grid">${select('Material','bp_mat',['Copper','Aluminum'],'Copper')}${field('Total required current A','bp_i',3000)}${field('Each bar width mm','bp_w',100)}${field('Each bar thickness mm','bp_t',6)}</div><p class="note">N = total current ÷ one-bar worksheet ampacity, rounded UP. The practice 1200 A single-bar cap is applied when using this Rule 4-036 shortcut.</p>`),btn('Calculate number of straps / bars','calcBusStraps()'),'o_bb_straps'));
          s4Panes.push(work(card('Editable current-density method',`<div class="grid">${field('Target current I A','bd_i',1200)}${field('Current density J A/mm²','bd_j',1.2)}${field('Selected thickness mm','bd_t',10)}</div><p class="note">Generic study/engineering method: J = I/A and A = I/J. This is intentionally separate from the CEC Rule 4-036 worksheet shortcut.</p>`),btn('Calculate by current density','calcBusDensity()'),'o_bb_density'));
          '''
          if 'window.s8Panes=[];' not in x:
              raise SystemExit('s8 marker not found')
          x = x.replace('window.s8Panes=[];', busbar_panes + 'window.s8Panes=[];', 1)

          html_marker = ",s8:`<section id=\"s8\" class=\"section\""
          s4_html = ",s4:`<section id=\"s4\" class=\"section\"><h1>Section 4 — Conductors / Busbars</h1><p class=\"lead\">Bare-busbar worksheet sizing, reverse sizing, parallel bars and current-density calculations.</p>${tabSet('s4',['Dimensions → Ampacity','Current → Bar Size','Parallel Straps / Bars','Current Density'])}</section>`,s8:`<section id=\"s8\" class=\"section\""
          if html_marker not in x:
              raise SystemExit('html s8 marker not found')
          x = x.replace(html_marker, s4_html, 1)

          support_line = r'''s12Panes.push(work(card('Supports & straps',`<div class="grid">${select('Wiring method','sup_type',['NMD90 / non-metallic sheathed cable','BX / AC90 armoured cable','Rigid metal conduit','EMT','Rigid PVC conduit','Flexible metal conduit','Liquid-tight flexible conduit','ENT'],'NMD90 / non-metallic sheathed cable')}${select('Trade size mm — raceways only','sup_size',[16,21,27,35,41,53,63,78,91,103,129,155],21)}${field('Straight run between boxes m','sup_run',10)}</div><p class="note">NMD90: within 300 mm of every box and no more than 1.5 m between supports — Rule 12-510(1). BX/AC90: same worksheet spacing — Rule 12-618(1)(a).</p>`),btn('Calculate minimum supports / straps','calcSupport()'),'o_sup'));
          '''
          x, n = re.subn(r"s12Panes\.push\(work\(card\('Supports & straps'[^\n]*\n", lambda m: support_line, x, count=1)
          if n != 1:
              raise SystemExit('support pane marker not found')

          bus_funcs = r'''function busK(mat){return mat==='Aluminum'?700:1000}
          function calcBusDim(){calcLocal('o_bb_dim',()=>{const mat=s('bb_mat'),w=n('bb_w'),t=n('bb_t'),area=w*t,k=busK(mat),raw=area/645*k,applies=t<=6.35,used=applies?Math.min(raw,1200):raw;return `BUSBAR — DIMENSIONS TO AMPACITY\n\nMaterial: ${mat}\nArea = ${w.toFixed(2)} × ${t.toFixed(2)} = ${area.toFixed(2)} mm²\nArea = ${(area/645).toFixed(4)} in²\n\nI = (Area ÷ 645) × ${k}\nCalculated current = ${raw.toFixed(2)} A\n${applies?`Rule 4-036 practice cap = 1200 A\nWorksheet value used = ${used.toFixed(2)} A`:'Thickness exceeds 6.35 mm — verify the actual CEC busbar requirements rather than using the flat-bar shortcut.'}\n\nPractice method: copper 1000 A/in²; aluminum 700 A/in².`})}
          function calcBusSize(){calcLocal('o_bb_size',()=>{const mat=s('bs_mat'),amps=n('bs_i'),t=n('bs_t'),w=n('bs_w'),k=busK(mat),area=amps*645/k,rw=area/t,rt=area/w;return `BUSBAR — CURRENT TO SIZE\n\nMaterial: ${mat}\nTarget current: ${amps.toFixed(2)} A\n\nA = I × 645 ÷ K = ${area.toFixed(2)} mm²\n\nWith ${t.toFixed(2)} mm thickness:\nRequired width = ${rw.toFixed(2)} mm\n\nWith ${w.toFixed(2)} mm width:\nRequired thickness = ${rt.toFixed(2)} mm\n\n${amps>1200?'Target exceeds the 1200 A single-bar practice limit — use parallel bars/straps or an engineered arrangement.':'Practice Rule 4-036 worksheet method.'}`})}
          function calcBusStraps(){calcLocal('o_bb_straps',()=>{const mat=s('bp_mat'),amps=n('bp_i'),w=n('bp_w'),t=n('bp_t');if(t>6.35)throw new Error('This worksheet strap method is limited to bar thickness at or below 6.35 mm');const k=busK(mat),area=w*t,raw=area/645*k,per=Math.min(raw,1200),count=Math.ceil(amps/per),share=amps/count;return `PARALLEL BUSBAR / STRAP COUNT\n\nOne bar area = ${area.toFixed(2)} mm²\nRaw one-bar ampacity = ${raw.toFixed(2)} A\nOne-bar worksheet value after 1200 A cap = ${per.toFixed(2)} A\n\nN = total current ÷ one-bar current, rounded UP\nN = ${(amps/per).toFixed(3)} → ${count} bars / straps\n\nEqual-share load = ${share.toFixed(2)} A per bar\nCombined worksheet capacity = ${(count*per).toFixed(2)} A\nTotal metal area = ${(count*area).toFixed(2)} mm²\n\nVerify spacing, terminations, current sharing, temperature rise and equipment construction for real installations.`})}
          function calcBusDensity(){calcLocal('o_bb_density',()=>{const amps=n('bd_i'),j=n('bd_j'),t=n('bd_t'),area=amps/j,w=area/t;return `EDITABLE CURRENT-DENSITY METHOD\n\nJ = I ÷ A\nA = I ÷ J\n\nA = ${amps.toFixed(2)} ÷ ${j.toFixed(3)} = ${area.toFixed(2)} mm²\nWith ${t.toFixed(2)} mm thickness:\nRequired width = ${w.toFixed(2)} mm\n\nExample: 1200 A ÷ 1.2 A/mm² = 1000 mm².\n\nThis is a generic study/engineering calculation, not a replacement for Rule 4-036 or thermal/equipment design.`})}
          '''
          if 'function calcBends()' not in x:
              raise SystemExit('calcBends marker not found')
          x = x.replace('function calcBends()', bus_funcs + 'function calcBends()', 1)

          support_funcs = r'''function supportRule(t,z){if(t==='NMD90 / non-metallic sheathed cable')return[1.5,.3,'CEC 2024 Rule 12-510(1)'];if(t==='BX / AC90 armoured cable')return[1.5,.3,'CEC 2024 Rule 12-618(1)(a)'];if(t==='Rigid metal conduit')return[z<=21?1.5:z<=35?2:3,0,'CEC 2024 Rule 12-1010'];if(t==='EMT')return[z<=21?1.5:z<=35?2:3,1,'CEC 2024 Rules 12-1406 / 12-1010'];if(t==='Rigid PVC conduit')return[z<=27?.75:z<=41?1.2:z<=53?1.5:z<=78?1.8:z<=129?2.1:2.5,0,'CEC 2024 Rule 12-1114'];if(t==='Flexible metal conduit')return[1.5,.3,'CEC 2024 Rule 12-1010(3)'];if(t==='Liquid-tight flexible conduit')return[1.5,.3,'CEC 2024 Rule 12-1308'];return[1,1,'CEC 2024 Rule 12-1504']}function calcSupport(){calcLocal('o_sup',()=>{const t=s('sup_type'),z=i('sup_size'),L=n('sup_run'),[space,near,ref]=supportRule(t,z),cable=t.startsWith('NMD90')||t.startsWith('BX / AC90');let count=near<=0?Math.max(1,Math.ceil(L/space)):(L<=2*near?1:2+Math.max(0,Math.ceil((L-2*near)/space)-1));return `${t}\n${cable?'':`Trade size: ${z} mm\n`}Maximum support spacing: ${space.toFixed(2)} m\nNear box/fitting: ${near?`within ${near.toFixed(2)} m of each box`:'see raceway-specific rule'}\nReference: ${ref}\n\nMinimum straight-run support / strap count: ${count}\n\nPlace supports near each end, then add supports so no interval exceeds the maximum spacing. A 22 m NMD90 or AC90 run with the worksheet spacing calculates to 16 supports.`})}
          '''
          x, n = re.subn(r"function supportRule\(t,z\)\{.*?\}function calcSupport\(\)\{.*?\}\nfunction calcLV", lambda m: support_funcs + 'function calcLV', x, count=1)
          if n != 1:
              raise SystemExit('support functions marker not found')

          p.write_text(x, encoding='utf-8')
          PY

      - name: Commit web calculator additions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/src/main/resources/static/calculators.html
          git diff --cached --quiet && exit 0
          git commit -m "Add web busbar and cable strap calculators"
          git push origin HEAD:main

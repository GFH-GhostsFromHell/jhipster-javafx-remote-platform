name: Verify Conduit Bender Draft

on:
  push:
    branches: [ feature-conduit-bender-workflow ]

permissions:
  contents: read

jobs:
  compile-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and verify desktop client
        run: mvn -B -DskipTests clean package

name: Patch Android busbar calculator list

on:
  push:
    branches: [ development/functionality ]
    paths:
      - '.github/workflows/patch-android-busbar-list.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/functionality
      - name: Add Section 4 to Android calculator list
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-client/app/src/main/java/com/gfh/electricalworkbench/MainActivity.kt')
          x=p.read_text(encoding='utf-8')
          old='"General Rules", "Section 8 · Services & Demand", "Section 12 · Wiring Methods",'
          new='"General Rules", "Section 4 · Conductors / Busbars", "Section 8 · Services & Demand", "Section 12 · Wiring Methods",'
          if old not in x:
              raise SystemExit('Android sections marker not found')
          p.write_text(x.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit Android list update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-client/app/src/main/java/com/gfh/electricalworkbench/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "List Section 4 busbar tools on Android"
          git push origin HEAD:development/functionality

name: Apply conductor ampacity calculator

on:
  push:
    branches: [ main ]
    paths:
      - '.github/add_conductor_ampacity_calculator.py'
      - '.github/workflows/apply-conductor-ampacity-calculator.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply conductor ampacity patch
        run: python .github/add_conductor_ampacity_calculator.py

      - name: Compile portal
        working-directory: portal
        run: mvn -B -DskipTests package

      - name: Compile desktop
        working-directory: desktop-client
        run: mvn -B -DskipTests package

      - name: Commit permanent source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-client/src/main/java/com/example/desktop/GuidedWorksheetPane.java portal/src/main/resources/static/guided-calculators.html
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Add dedicated conductor ampacity calculator'
            git push origin main
          fi

name: Build Android Client

on:
  push:
    branches: [development/functionality, main]
    paths:
      - 'android-client/**'
      - '.github/workflows/build-android-client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ElectricalWorkbench-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElectricalWorkbench-Android
          path: android-client/ElectricalWorkbench-Android.apk

      - name: Publish development APK release
        if: github.ref == 'refs/heads/development/functionality'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-dev-v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ElectricalWorkbench-Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Electrical Workbench Android DEV 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Development Android build of Electrical Workbench." \
            --prerelease

      - name: Publish stable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ElectricalWorkbench-Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Electrical Workbench Android 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Android build of Electrical Workbench."

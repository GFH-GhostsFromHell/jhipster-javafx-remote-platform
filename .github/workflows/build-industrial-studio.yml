name: Industrial Control Studio validation
on:
  push:
    paths:
      - 'industrial-studio/**'
      - '.github/workflows/build-industrial-studio.yml'
  pull_request:
    paths:
      - 'industrial-studio/**'
      - '.github/workflows/build-industrial-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [portal, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: industrial-studio/${{ matrix.module }}/pom.xml
      - name: Validate browser HMI editor JavaScript
        if: matrix.module == 'portal'
        run: node --check industrial-studio/portal/src/main/resources/static/screen-designer.js
      - name: Build
        working-directory: industrial-studio/${{ matrix.module }}
        run: mvn --batch-mode -DskipTests=false verify

name: Apply guided workspace upgrade

on:
  push:
    branches: [ main ]
    paths:
      - '.github/finish_guided_workspace_upgrade.py'
      - '.github/workflows/apply-guided-workspace-upgrade.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply integration patch
        run: python .github/finish_guided_workspace_upgrade.py
      - name: Compile portal
        working-directory: portal
        run: mvn -B -DskipTests package
      - name: Compile desktop
        working-directory: desktop-client
        run: mvn -B -DskipTests package
      - name: Commit permanent source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-client/src/main/java/com/example/desktop/ElectricianPlatformPane.java desktop-client/src/main/java/com/example/desktop/LocalWorkspaceStore.java android-client/app/src/main/java/com/gfh/electricalworkbench/MobileWorkbenchActivity.kt portal/src/main/resources/static/calculators.html android-client/app/src/main/assets/release-notes.txt
          git diff --cached --quiet && exit 0
          git commit -m "Integrate guided calculators and fix Daily 25 answer choices"
          git push origin main

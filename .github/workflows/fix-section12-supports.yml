name: Fix Section 12 Cable Straps and Conduit Supports

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-section12-supports.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Section 12 calculators
        run: python3 .github/scripts/fix_section12_supports.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-client/src/main/java/com/example/desktop/SectionedCalculatorPane.java portal/src/main/resources/static/calculators.html
          git commit -m "Separate cable strap and conduit support calculators"
          git push

name: Patch calculator advanced link
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-calculator-advanced-link.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('portal/src/main/resources/static/calculators.html')
          x=p.read_text()
          old='<div><a href="/portal.html">Account portal</a> <button onclick="logout()">Sign out</button></div>'
          new='<div><a href="/advanced-calculations.html">Advanced calculations</a> <a href="/portal.html">Account portal</a> <button onclick="logout()">Sign out</button></div>'
          if old not in x: raise SystemExit('header marker missing')
          p.write_text(x.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add portal/src/main/resources/static/calculators.html
          git commit -m 'Link advanced calculations from calculator workspace'
          git push origin HEAD:main
